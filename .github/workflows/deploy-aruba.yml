name: Deploy to Aruba Hosting (FTP)

# DISABLED for automatic runs: Aruba drops connections from GitHub's cloud
# (Azure) runner IPs, so the FTP control socket always times out
# ("Error: Timeout (control socket)"). Real deploys run locally: `npm run deploy`
# (see scripts/deploy-ftp.sh). Kept as manual-dispatch only for reference / use
# from a self-hosted runner on a network Aruba accepts.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Astro Site
        run: npm run build

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          # Aruba's FTP login dir is NOT the web root; docroot is this subfolder:
          server-dir: ./www.mastertetto.it/
          dangerous-clean-slate: false
          # differential sync is default
